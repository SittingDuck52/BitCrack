name: Build BitCrack (CUDA 12.9)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: CUDA Toolkit 12.9 installieren
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'
          method: 'local'

      - name: CUDA-Umgebung und VS-Integration einrichten
        run: |
          "CUDA_PATH_V12_9=$env:CUDA_PATH" >> $env:GITHUB_ENV
          $vs  = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dst = Join-Path $vs 'MSBuild\Microsoft\VC\v170\BuildCustomizations'
          Copy-Item "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions\*" $dst -Force
          Get-ChildItem $dst -Filter 'CUDA*' | Select-Object Name

      - name: Projektdateien an CUDA 12.9 anpassen
        run: |
          Get-ChildItem -Recurse -Include *.vcxproj,*.props -File | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $n = $c -replace 'CUDA 10\.1\.(props|targets)', 'CUDA 12.9.$1' `
                    -replace 'C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v10\.1', '$(CUDA_PATH)' `
                    -replace 'cuda\.lib;', ''
            if ($n -ne $c) { Set-Content $_.FullName $n -NoNewline; "angepasst: $($_.Name)" }
          }
          # OpenCL-Kernel als OpenCL C 1.2 uebersetzen (Fix fuer "changes address space of pointer")
          $f = 'CLKeySearchDevice\CLKeySearchDevice.cpp'
          (Get-Content $f -Raw) -replace 'new cl::CLProgram\(\*_clContext, _bitcrack_cl\)', 'new cl::CLProgram(*_clContext, _bitcrack_cl, "-cl-std=CL1.2")' | Set-Content $f -NoNewline
          Select-String -Path $f -Pattern 'cl-std'

      - uses: microsoft/setup-msbuild@v2

      - name: cuBitCrack bauen
        run: msbuild BitCrack.sln /t:cuKeyFinder /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:CudaToolkitCustomDir=$env:CUDA_PATH"

      - name: clBitCrack bauen
        continue-on-error: true
        run: msbuild BitCrack.sln /t:clKeyFinder /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Paket zusammenstellen
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem -Recurse -Include cuBitCrack.exe,clBitCrack.exe -File | Where-Object FullName -notlike '*\out\*' | Copy-Item -Destination out
          Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll" out
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BitCrack-CUDA12.9
          path: out
